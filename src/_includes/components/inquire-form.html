<form class="inquire-form" data-dm="{{ client.instagramDm }}" method="post">
    <label>
        Name
        <input name="name" type="text" required autocomplete="name" placeholder="Your name">
    </label>
    <label>
        Email
        <input name="email" type="email" required autocomplete="email" placeholder="you@email.com">
    </label>
    <label>
        Piece
        <input name="piece" type="text" required value="{{ piece or 'A custom card or sign' }}">
    </label>
    <label>
        Event date or need-by date
        <input name="date" type="text" placeholder="The day you need it">
    </label>
    <label class="full">
        The words, the colors, the occasion
        <textarea name="note" rows="5" required placeholder="Who it is for, what it should say, and anything it needs to look like."></textarea>
    </label>
    <div class="form-actions">
        <button class="btn btn-solid" type="submit">Copy note &amp; open Instagram</button>
        <p class="form-hint">Hart It takes inquiries by DM. This copies your note, then opens Instagram so you can paste it.</p>
    </div>
    <p class="form-status" role="status" hidden></p>
</form>

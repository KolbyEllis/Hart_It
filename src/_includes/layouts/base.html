<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="{{ description }}">
        <link rel="canonical" href="https://{{ client.domain }}{{ page.url }}">
        <meta property="og:title" content="{{ title }}" />
        <meta property="og:description" content="{{ description }}" />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://{{ client.domain }}{{ page.url }}" />
        <meta name="theme-color" content="#1c3a32">
        <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,650;1,9..144,560&family=Oooh+Baby&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/assets/css/hart.css">
        <script defer src="/assets/js/nav.js"></script>
        <script defer src="/assets/js/inquire.js"></script>
        {% block head %}{% endblock %}
        <title>
            {% if page.url == '/' %}
                Custom Cards &amp; Event Signage | Hart It
            {% else %}
                {{ title }} | Hart It
            {% endif %}
        </title>
    </head>
    <body>
        <a class="skip" href="#main">Skip to main content</a>
        {% include "components/header.html" %}
        <main id="main">
            {% block body %}{% endblock %}
        </main>
        {% include "components/footer.html" %}
    </body>
</html>
